<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List </title>
    <link rel="stylesheet" href="myp.css">
</head>
<body>

    <header>
        <div id="header">
            <h2> Add Features </h2>
        </div>
    </header>

    <section>
        <div id="select">
            <button id="changeBC"> Background Color </button>
            <button id="Magic"> Magical Button </button>
            <button id="ChangeFont"> Font Text </button>
            <button id="changeBI"> Background Image </button>
            <button id="textcolor"> Font Color </button>
            <button id="reset"> Reset </button>
            <div class="box">
                <h3> Font size </h3>
                <button id="increase"> + </button>
                <button id="decrease"> - </button>

            </div>
        </div>
        <form id="info">
            <input id="text" type="text" placeholder="Enter text here">
            <input id="add" type="submit" value="Add">
        </form>
    </section>

    <div class="container">
        <div id="main"> </div>
    </div>

    <script src="myp.js"></script>
</body>
</html>
